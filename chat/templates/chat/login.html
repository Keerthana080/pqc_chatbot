<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Log In — PQC Secure Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 80px auto; }
        input { display: block; width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; }
        .errorlist { color: #c00; font-size: 0.85em; margin: -8px 0 8px; padding-left: 0; list-style: none; }
    </style>
</head>
<body>
    <h2>🔐 Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
    <p><a href="{% url 'chat:signup' %}">Need an account? Sign up</a></p>
</body>
</html>
